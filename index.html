<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>I LOVE YOU</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const c = document.getElementById("c");
      const ctx = c.getContext("2d");
      let W, H;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = c.clientWidth;
        H = c.clientHeight;
        c.width = W * dpr;
        c.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener("resize", resize);
      resize();

      function hx(t) {
        return 16 * Math.pow(Math.sin(t), 3);
      }
      function hy(t) {
        return -(
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t)
        );
      }

      const N = 520;
      const labels = [];
      for (let i = 0; i < N; i++) {
        const u = Math.random();
        labels.push({
          u,
          t: u * Math.PI * 2,
          k: 0.8 + Math.random() * 0.2,
          jx: (Math.random() - 0.5) * 0.5,
          jy: (Math.random() - 0.5) * 0.5,
          fs: 6 + Math.random() * 5,
          ph: Math.random() * 6.28,
          sp: 1.5 + Math.random() * 4,
          br: Math.random() < 0.12 ? 1 : 0.55,
        });
      }

      const CYCLE = 11;
      function ease(x) {
        return x * x * (3 - 2 * x);
      }

      function beat(t) {
        const p = (t % 1.3) / 1.3;
        return Math.min(
          1,
          Math.exp(-Math.pow((p - 0.1) / 0.06, 2)) +
            0.6 * Math.exp(-Math.pow((p - 0.28) / 0.07, 2)),
        );
      }

      function frame(ms) {
        const t = ms / 1000;
        if (t >= 4) {
          ctx.clearRect(0, 0, W, H);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const fontSize = Math.min(W * 0.095, H * 0.16);
          ctx.font = 'bold ' + fontSize.toFixed(1) + 'px "Courier New", monospace';
          ctx.shadowColor = "rgba(0, 255, 255, 0.9)";
          ctx.shadowBlur = 6;
          ctx.fillStyle = "rgba(140, 255, 255, 1)";
          ctx.fillText("I just LOVE YOU", W / 2, H / 2);
          ctx.shadowBlur = 0;
          requestAnimationFrame(frame);
          return;
        }
        const ph = (t % CYCLE) / CYCLE;
        let head = 1,
          tail = 0;
        if (ph < 0.38) head = ease(ph / 0.38);
        else if (ph > 0.72) tail = ease((ph - 0.72) / 0.28);

        const b = beat(t);
        const size = (Math.min(W, H) / 38) * (1 + 0.05 * b);
        const cx = W / 2,
          cy = H / 2 + size * 0.5;

        ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (const l of labels) {
          if (l.u > head || l.u < tail) continue;
          const edge = Math.min((head - l.u) / 0.05, (l.u - tail) / 0.05, 1);
          if (edge <= 0) continue;

          const flick = 0.5 + 0.5 * Math.sin(t * l.sp + l.ph);
          let a = edge * l.br * (0.25 + 0.75 * flick) * (0.8 + 0.4 * b);

          if (head < 1 && head - l.u < 0.04) a = Math.min(1, a + 0.6);

          const x = cx + (hx(l.t) * l.k + l.jx) * size;
          const y = cy + (hy(l.t) * l.k + l.jy) * size;

          ctx.font = "bold " + l.fs.toFixed(1) + 'px "Courier New", monospace';
          ctx.shadowColor = "rgba(0, 255, 255, 0.9)";
          ctx.shadowBlur = 6;
          ctx.fillStyle =
            "rgba(140, 255, 255, " + Math.min(1, a).toFixed(3) + ")";
          ctx.fillText("I LOVE YOU", x, y);
        }
        ctx.shadowBlur = 0;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
